.t-ide{position:relative;width:1000px;height:640px;overflow:hidden;background:#1E1E1E;font-family:Inter,sans-serif;color:#CCC;-webkit-font-smoothing:antialiased}

.ide-act{position:absolute;left:0;top:34px;bottom:24px;width:48px;background:#181818;border-right:1px solid #2B2B2B;display:flex;flex-direction:column;align-items:center;gap:20px;padding-top:14px}
.ide-act i{width:22px;height:22px;border-radius:5px;border:2px solid #858585}
.ide-act i:first-child{border-color:#D7D7D7;box-shadow:-13px 0 0 -11px #0078D4}
.ide-exp{position:absolute;left:48px;top:34px;bottom:24px;width:210px;background:#181818;border-right:1px solid #2B2B2B;padding:10px 0;font:500 12.5px Inter;color:#CCC}
.ide-exp .h{padding:0 16px 8px;font:600 11px Inter;letter-spacing:.6px;color:#9D9D9D}
.ide-exp .f{padding:4px 16px;display:flex;align-items:center;gap:8px}
.ide-exp .f b{width:14px;height:10px;border-radius:2px;display:inline-block}
.ide-exp .f.on{background:#37373D}
.ide-tabs{position:absolute;left:258px;right:0;top:34px;height:36px;background:#181818;display:flex}
.ide-tabs div{padding:0 16px;display:flex;align-items:center;gap:8px;font:500 12.5px Inter;color:#9D9D9D;border-right:1px solid #2B2B2B}
.ide-tabs div.on{background:#1E1E1E;color:#FFF;box-shadow:inset 0 1px 0 #0078D4}
.ide-tabs b{width:14px;height:10px;border-radius:2px;background:#F1C40F}
.ide-num{position:absolute;left:258px;top:78px;width:48px;text-align:right;font:400 13px/22px Mono,monospace;color:#6E7681}
.ide-code{position:absolute;left:330px;right:110px;top:78px;bottom:24px;overflow:hidden}
.ide-code .ln{height:22px;display:flex;align-items:center;gap:8px}
.ide-code .ln i{height:9px;border-radius:4px;opacity:.92;flex:none}
.ide-code .ide-caret{position:absolute;left:0;top:6px;width:2px;height:18px;background:#AEAFAD;display:none}
.ide-mini{position:absolute;right:14px;top:78px;width:80px;bottom:30px;opacity:.5}
.ide-mini div{height:2px;margin-bottom:2px;border-radius:1px}
.ide-sb{position:absolute;left:0;right:0;bottom:0;height:24px;background:#0078D4;display:flex;align-items:center;gap:16px;padding:0 12px;font:500 11.5px Inter;color:#fff}
.t-ide.empty .ide-code .ln,.t-ide.empty .ide-mini{display:none}
.t-ide.empty .ide-code .ide-caret{display:block}
.t-ide.empty .ide-num div:nth-child(n+2){opacity:0}
