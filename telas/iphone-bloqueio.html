<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Tela · iPhone bloqueio</title>
<link rel="stylesheet" href="fonts.css">
<style data-tela="iphone-bloqueio">
/* ===== Tela de bloqueio do iPhone, 430x932 (pontos do iPhone; use CSS zoom para ampliar sem perder nitidez) =====
   Só a tela (cantos de 55 px), sem desenhar o corpo do aparelho.
   Estados: data-state="off" (tela apagada) | "on" | "notif" (notificação visível) | "tap" (notificação pressionada)
   Slots: [data-slot=date] [data-slot=time] [data-slot=n-title] [data-slot=n-body] [data-slot=n-time] */
.t-ip{position:relative;width:430px;height:932px;border-radius:55px;overflow:hidden;background:#05060a;font-family:Inter,-apple-system,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
.ip-wall{position:absolute;inset:0;background:
  radial-gradient(120% 70% at 20% 110%,#ff5a3c 0%,rgba(255,90,60,0) 55%),
  radial-gradient(90% 60% at 100% 85%,#7a1cff 0%,rgba(122,28,255,0) 60%),
  radial-gradient(110% 80% at 50% 0%,#1b2a6b 0%,rgba(27,42,107,0) 70%),
  linear-gradient(#0b1030,#120a24 60%,#1a0b14)}
.ip-wall::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 40% at 70% 60%,rgba(255,255,255,.08),transparent 70%)}
.ip-sb{position:absolute;left:0;right:0;top:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 34px 0 40px;font:600 16px Inter;z-index:3}
.ip-sb .r{display:flex;align-items:center;gap:7px}
.ip-sb svg{display:block}
.ip-di{position:absolute;left:50%;top:11px;width:126px;height:37px;margin-left:-63px;border-radius:20px;background:#000;z-index:4}
.ip-lock{position:absolute;left:50%;top:66px;margin-left:-9px;width:18px;height:22px;z-index:3}
.ip-date{position:absolute;left:0;right:0;top:100px;text-align:center;font:600 21px Inter;opacity:.9;letter-spacing:.1px}
.ip-time{position:absolute;left:0;right:0;top:118px;text-align:center;font:600 112px/1.08 Inter;letter-spacing:-3px;color:rgba(255,255,255,.96)}
.ip-n{position:absolute;left:12px;right:12px;top:574px;border-radius:24px;padding:13px 14px 14px;display:flex;gap:11px;background:rgba(30,30,36,.42);-webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.18);transform-origin:50% 50%}
.ip-n .ic{width:38px;height:38px;border-radius:9px;background:linear-gradient(#5ff777,#1ec03f);display:flex;align-items:center;justify-content:center;flex:none}
.ip-n .ic img{width:25px;height:25px}
.ip-n .tx{flex:1;min-width:0}
.ip-n .hd{display:flex;justify-content:space-between;font:600 15px Inter}
.ip-n .hd span{font:400 13px Inter;opacity:.65}
.ip-n .bd{font:400 15px/1.3 Inter;opacity:.95;margin-top:1px}
.ip-bt{position:absolute;bottom:44px;width:50px;height:50px;border-radius:50%;background:rgba(0,0,0,.32);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:center}
.ip-bt svg{width:22px;height:22px}
.ip-home{position:absolute;left:50%;bottom:8px;width:140px;height:5px;margin-left:-70px;border-radius:3px;background:#fff}
.t-ip[data-state=off] > :not(.ip-di){opacity:0}
.t-ip[data-state=on] .ip-n{opacity:0}
.t-ip[data-state=tap] .ip-n{transform:scale(.96);background:rgba(60,60,70,.55)}
</style></head>
<body style="margin:0;background:#777;padding:30px;display:flex;gap:30px">
<!--tela-->
<div class="t-ip" data-state="notif">
  <div class="ip-wall"></div>
  <div class="ip-di"></div>
  <div class="ip-sb"><span>TIM</span><div class="r">
    <svg width="18" height="12" viewBox="0 0 18 12" fill="#fff"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
    <svg width="17" height="12" viewBox="0 0 17 12" fill="#fff"><path d="M8.5 2.3c2.4 0 4.6.9 6.2 2.4l1.2-1.2A10.4 10.4 0 0 0 8.5.6 10.4 10.4 0 0 0 1.1 3.5l1.2 1.2a8.8 8.8 0 0 1 6.2-2.4zm0 3.4c1.5 0 2.8.5 3.8 1.4l1.2-1.2A7.2 7.2 0 0 0 8.5 4a7.2 7.2 0 0 0-5 2l1.2 1.1c1-.9 2.3-1.4 3.8-1.4zm0 3.3c-.6 0-1.2.2-1.6.6L8.5 11.2l1.6-1.6c-.4-.4-1-.6-1.6-.6z"/></svg>
    <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="#fff" stroke-opacity=".45"/><rect x="2" y="2" width="16" height="9" rx="2" fill="#fff"/><path d="M25 4.5v4a2 2 0 0 0 0-4z" fill="#fff" fill-opacity=".45"/></svg></div></div>
  <svg class="ip-lock" viewBox="0 0 18 22" fill="#fff"><path d="M4 9V6.5a5 5 0 0 1 10 0V9h-2V6.5a3 3 0 0 0-6 0V9z"/><rect x="1" y="9" width="16" height="12" rx="3"/></svg>
  <div class="ip-date" data-slot="date">sexta-feira, 14 de novembro</div>
  <div class="ip-time" data-slot="time">17:42</div>
  <div class="ip-n"><div class="ic"><img src="img/whatsapp-white.svg"></div><div class="tx"><div class="hd"><b data-slot="n-title">Chefe</b><span data-slot="n-time">agora</span></div><div class="bd" data-slot="n-body">preciso do post da promoção até segunda</div></div></div>
  <div class="ip-bt" style="left:46px"><svg viewBox="0 0 22 22" fill="#fff"><path d="M7 2h8l-1 5H8zM8 8h6v11a1.5 1.5 0 0 1-1.5 1.5h-3A1.5 1.5 0 0 1 8 19z"/></svg></div>
  <div class="ip-bt" style="right:46px"><svg viewBox="0 0 22 22" fill="#fff"><path d="M2.5 7.5A2 2 0 0 1 4.5 5.5h2.2L8.2 3.5h5.6l1.5 2h2.2a2 2 0 0 1 2 2v9.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/><circle cx="11" cy="12" r="3.6" fill="#333"/></svg></div>
  <div class="ip-home"></div>
</div>
<!--/tela-->
</body></html>
