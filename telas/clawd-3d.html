<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>3D · Clawd (mascote do Claude Code) em voxels</title>
<link rel="stylesheet" href="fonts.css">
<style>body{margin:0;background:#0c0c0c;color:#F2EEE6;font:700 18px Mono;display:grid;grid-template-columns:repeat(2,560px);gap:20px;padding:20px}figure{margin:0}canvas{width:560px;height:560px;display:block;background:radial-gradient(ellipse at 50% 40%,#1d1d1d,#0c0c0c 70%);border-radius:18px}figcaption{margin-top:8px;color:#8f8a82}</style>
<script src="js/three.min.js"></script><script src="js/g3d.js"></script></head><body>
<!-- Clawd fiel ao ícone oficial (img/claudecode-color.svg): corpo 12x8 voxels, braços 2x2, olhos 1x2, 4 pernas.
     API: G3D.clawd({pose:'idle'|'nod'|'type'|'write', k:0..1, voxel:.1, depth:6, armDepth:2, color})  ·  G3D.pose(clawd, pose, k)
     Abra por um servidor http (texturas). -->
<figure><canvas id="c1" width="1120" height="1120"></canvas><figcaption>idle</figcaption></figure>
<figure><canvas id="c2" width="1120" height="1120"></canvas><figcaption>nod (acenando)</figcaption></figure>
<figure><canvas id="c3" width="1120" height="1120"></canvas><figcaption>type (sentado no notebook)</figcaption></figure>
<figure><canvas id="c4" width="1120" height="1120"></canvas><figcaption>write (escrevendo com caneta)</figcaption></figure>
<script>
window.READY=false;const T=THREE,G=G3D;
const base=(pose,k)=>{const st=G.stage({fov:26,rim:1.2,rimColor:0xffc49a});st.ground(0,.45);const c=G.clawd({pose,k});st.scene.add(c);c.rotation.y=-.45;st.look([.3,1.1,3.9],[0,.48,0]);return {st,c};};
{const {st}=base('idle',1);st.draw(c1);}
{const {st}=base('nod',.9);st.draw(c2);}
{const st=G.stage({fov:30,rim:1.2,rimColor:0xffc49a});st.ground(0,.5);
 const scr=G.canvasTex(1000,640,(c,w,h)=>{const g=c.createLinearGradient(0,0,w,0);g.addColorStop(0,'#00C4CC');g.addColorStop(1,'#7D2AE8');c.fillStyle='#f3f1fb';c.fillRect(0,0,w,h);c.fillStyle=g;c.fillRect(0,0,w,60);c.fillStyle='#F5B700';c.fillRect(420,130,360,360);});
 const lap=G.laptop({screen:scr,open:.22});lap.position.set(.35,0,-.4);lap.rotation.y=.42;st.scene.add(lap);
 const c=G.clawd({pose:'type',armDepth:4});c.scale.setScalar(.95);c.position.set(-1.75,0,.85);c.rotation.y=1.05;st.scene.add(c);
 st.look([1.2,2.6,7.0],[-.75,.7,-.1]);st.draw(c3);}
{const st=G.stage({fov:28,rim:1.2,rimColor:0xffc49a});st.ground(0,.4);
 const paper=new T.Mesh(new T.BoxGeometry(2,.02,2.8),new T.MeshStandardMaterial({color:0xfbfaf6,roughness:.85}));paper.position.set(.1,.01,.55);paper.receiveShadow=true;st.scene.add(paper);
 const c=G.clawd({pose:'write'});c.scale.setScalar(.95);c.position.set(-.2,0,-1.55);c.rotation.y=.15;st.scene.add(c);
 const pen=new T.Mesh(new T.CylinderGeometry(.045,.045,1,24),new T.MeshPhysicalMaterial({color:0xFF2D2D,clearcoat:1,roughness:.25}));pen.position.set(.3,.62,.2);pen.rotation.set(.25,0,-.55);pen.castShadow=true;st.scene.add(pen);
 st.look([.9,4.4,5.4],[0,.35,-.35]);st.draw(c4);}
window.READY=true;
</script></body></html>
