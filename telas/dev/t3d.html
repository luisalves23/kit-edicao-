<!doctype html><html><head><meta charset=utf-8><style>body{margin:0;background:#151515;display:grid;grid-template-columns:repeat(2,600px)}canvas{width:600px;height:600px}</style>
<script src="../js/three.min.js"></script><script src="../js/g3d.js"></script></head><body>
<canvas id=a width=600 height=600></canvas><canvas id=b width=600 height=600></canvas><canvas id=c width=600 height=600></canvas><canvas id=d width=600 height=600></canvas>
<script>
window.READY=false;
fetch('../img/_paths.json').then(r=>r.json()).then(P=>{
let s=G3D.stage({fov:28});const cl=G3D.clawd({pose:'nod',k:.6});s.scene.add(cl);s.ground(-0.0,.4);s.look([1.4,1.0,2.8],[0,.45,0]);s.draw(a);
s=G3D.stage({fov:30});const so=G3D.socket();s.scene.add(so);const pl=G3D.plug({logo:G3D.tex('../img/claude-icon.jpg')});pl.position.z=1.2;s.scene.add(pl);s.look([4.2,1.6,4.6],[0,0,0.6]);
const icon=G3D.appIcon(G3D.tex('../img/claude-icon.jpg',()=>{s.draw(b);}));
s2=G3D.stage({fov:26});s2.scene.add(icon);const cv=G3D.appIcon(G3D.canvaTex(P.canva),{side:0x6a4ce8});cv.position.x=2.4;s2.scene.add(cv);icon.position.x=-.4;icon.rotation.y=.35;cv.rotation.y=-.3;s2.look([1,0.6,7],[1,0,0]);
setTimeout(()=>{s.draw(b);s2.draw(c);
s3=G3D.stage({fov:26,keyColor:0xffe2b0});const pl2=G3D.plate();s3.scene.add(pl2);for(let i=0;i<5;i++){const m=G3D.paoDeQueijo(i+1);m.scale.setScalar(.62);m.position.set([-.7,.7,0,-.6,.6][i],.58,[.3,.3,-.6,-.7,-.5][i]+.2);m.rotation.y=i;s3.scene.add(m);}s3.ground(0,.35);s3.look([0,2.6,5.6],[0,.4,0]);s3.draw(d);window.READY=true;},1500);
});
</script></body></html>
