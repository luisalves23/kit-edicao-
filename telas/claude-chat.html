<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Tela · Claude chat</title>
<link rel="stylesheet" href="fonts.css">
<style data-tela="claude-chat">
/* ===== Claude (claude.ai / app desktop), tela nativa 1000x700 =====
   Estados (atributo data-state na raiz): home (saudação + caixa no centro) | chat (conversa + caixa embaixo)
   Tema: data-theme="light" (padrão) | "dark"
   Slots: [data-slot=hello] [data-slot=text] (texto digitado; use <b class=kw> p/ palavras-chave)
          [data-slot=thread] (mensagens: .cc-u, .cc-a, .cc-tool, .cc-designs) */
.t-cc{--bg:#FAF9F5;--side:#F5F4EE;--ink:#141413;--ink2:#3D3D3A;--muted:#73726C;--line:rgba(31,30,29,.15);--box:#FFFFFF;--user:#F0EEE6;--acc:#C6613F;--spark:#D97757;--chip:#FFFFFF;--hover:#EDEBE3;
  position:relative;width:1000px;height:700px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.t-cc[data-theme=dark]{--bg:#262624;--side:#1F1E1D;--ink:#F5F4EE;--ink2:#E5E3DA;--muted:#9C9A92;--line:rgba(222,220,209,.15);--box:#30302E;--user:#141413;--chip:#30302E;--hover:#3A3936}
.t-cc svg{display:block}
.cc-rail{position:absolute;left:0;top:0;bottom:0;width:56px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding-top:12px;gap:6px}
.cc-rail .ri{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.cc-rail .ri svg{width:20px;height:20px}
.cc-rail .new{width:28px;height:28px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;margin:6px 0 4px}
.cc-rail .new svg{width:16px;height:16px}
.cc-rail .me{position:absolute;bottom:14px;width:30px;height:30px;border-radius:50%;background:#3D3D3A;color:#fff;font:600 13px/30px Inter;text-align:center}
.t-cc[data-theme=dark] .cc-rail .me{background:#E5E3DA;color:#1F1E1D}
.cc-main{position:absolute;left:56px;right:0;top:0;bottom:0}
.cc-top{position:absolute;left:0;right:0;top:0;height:52px;display:flex;align-items:center;padding:0 20px;gap:8px;font:500 14px Inter;color:var(--ink2)}
.cc-top .cc-ttl{display:none;align-items:center;gap:6px}
.cc-top .plan{margin:0 auto;padding:6px 12px;border-radius:999px;background:var(--hover);font:500 12.5px Inter;color:var(--muted)}
.cc-top .plan b{color:var(--ink2);font-weight:600}
.cc-hello{position:absolute;left:0;right:0;top:206px;display:flex;justify-content:center;align-items:center;gap:14px;font:400 40px/1 SourceSerif,Georgia,serif;letter-spacing:-.4px;color:var(--ink2)}
.cc-hello svg{width:38px;height:38px}
.cc-composer{position:absolute;left:50%;width:672px;margin-left:-336px;top:274px;border-radius:20px;background:var(--box);border:1px solid var(--line);box-shadow:0 4px 20px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.03);padding:16px 16px 12px 20px}
.cc-input{position:relative;min-height:52px;font:400 16.5px/1.5 Inter;color:var(--ink);word-wrap:break-word;overflow-wrap:anywhere;white-space:normal}
.cc-input .ph{color:var(--muted);position:absolute;left:0;top:0;white-space:nowrap}
.cc-input .txt b.kw{font-weight:600;color:#FF2D2D}
.cc-input .caret{display:inline-block;width:2px;height:1.15em;background:var(--ink);vertical-align:-.2em;margin-left:1px}
.cc-row{display:flex;align-items:center;gap:8px;margin-top:10px}
.cc-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.cc-btn svg{width:17px;height:17px}
.cc-row .sp{flex:1}
.cc-model{display:flex;align-items:center;gap:4px;font:500 14px Inter;color:var(--muted);padding:0 8px}
.cc-model svg{width:12px;height:12px}
.cc-send{width:32px;height:32px;border-radius:8px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;opacity:.5}
.cc-send svg{width:16px;height:16px}
.t-cc .has-text .cc-send,.t-cc[data-send=on] .cc-send{opacity:1}
.cc-chips{position:absolute;left:0;right:0;top:420px;display:flex;justify-content:center;gap:8px}
.cc-chips span{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:var(--chip);font:500 13.5px Inter;color:var(--ink2)}
.cc-chips svg{width:15px;height:15px;color:var(--muted)}
/* conversa */
.cc-thread{position:absolute;left:50%;width:672px;margin-left:-336px;top:64px;bottom:150px;display:none;flex-direction:column;gap:18px;overflow:hidden}
.cc-u{align-self:flex-end;max-width:520px;padding:11px 16px;border-radius:14px;background:var(--user);font:400 16px/1.5 Inter;color:var(--ink)}
.cc-u b.kw{font-weight:600;color:#FF2D2D}
.cc-a{font:400 17px/1.6 SourceSerif,Georgia,serif;color:var(--ink)}
.cc-a b{font-weight:600}
.cc-a .spk{width:26px;height:26px;margin-top:6px}
.cc-tool{display:inline-flex;align-self:flex-start;align-items:center;gap:10px;padding:8px 12px 8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--box);font:500 14px Inter;color:var(--ink2)}
.cc-tool img{width:22px;height:22px;border-radius:50%}
.cc-tool .cc-st{color:var(--muted);font-weight:400}
.cc-tool .ok{width:16px;height:16px;color:#2f7d4f}
.cc-tool svg.chev{width:12px;height:12px;color:var(--muted)}
.cc-file{display:inline-flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:12px;border:1px solid var(--line);background:var(--box);align-self:flex-end;font:500 14px Inter}
.cc-file .ic{width:36px;height:40px;border-radius:6px;background:#E5484D;color:#fff;font:700 10px/40px Inter;text-align:center}
.cc-file small{display:block;color:var(--muted);font:400 12px Inter}
.cc-designs{display:flex;gap:12px}
.cc-designs .d{width:150px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--box)}
.cc-designs .d .im{width:150px;height:150px;overflow:hidden;position:relative}
.cc-designs .d .ft{display:flex;align-items:center;gap:6px;padding:7px 9px;font:500 12px Inter;color:var(--ink2)}
.cc-designs .d .ft img{width:14px;height:14px}
.t-cc[data-state=chat] .cc-hello,.t-cc[data-state=chat] .cc-chips{display:none}
.t-cc[data-state=chat] .cc-thread{display:flex}
.t-cc[data-state=chat] .cc-composer{top:auto;bottom:22px}
.t-cc[data-state=chat] .cc-top .cc-ttl{display:flex}
.t-cc[data-state=chat] .cc-top .plan{display:none}
</style></head>

<script>
// demo: injeta o caminho oficial da faísca e mostra os dois estados
(()=>{
  const a=document.querySelector('.t-cc'), b=a.cloneNode(true); a.after(b);
  a.querySelector('[data-slot=ph]').style.display='none';
  a.querySelector('[data-slot=text]').innerHTML='Cria <b class="kw">três posts</b> pro Instagram de uma <b class="kw">padaria</b>, promoção de <b class="kw">pão de queijo</b> na sexta<span class="caret"></span>';
  a.querySelector('.cc-composer').classList.add('has-text');
  b.dataset.state='chat';
  b.querySelector('[data-slot=thread]').innerHTML='<div class="cc-u">Cria <b class="kw">três posts</b> pro Instagram de uma <b class="kw">padaria</b>, promoção de <b class="kw">pão de queijo</b> na sexta</div><div class="cc-tool"><img src="img/canva.svg">Canva <span class="cc-st">· Gerar design</span><svg class="chev" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m4.5 3 3 3-3 3"/></svg></div><div class="cc-a">Pronto! Montei <b>três opções</b> no seu Canva:</div>';
})();
